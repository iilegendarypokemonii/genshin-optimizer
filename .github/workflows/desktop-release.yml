name: Windows desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'iilegendarypokemonii/genshin-optimizer'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DESKTOP_RELEASE_TAG: ${{ github.ref_name }}
      NX_DAEMON: "false"
      NX_URL_GITHUB_GO: https://github.com/iilegendarypokemonii/genshin-optimizer
      NX_URL_GITHUB_GO_CURRENT_VERSION: https://github.com/iilegendarypokemonii/genshin-optimizer/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install frontend dependencies
        run: node .yarn/releases/yarn-3.4.1.cjs install --immutable
      - name: Verify release tag
        run: node .yarn/releases/yarn-3.4.1.cjs verify release --stage tag --tag $env:DESKTOP_RELEASE_TAG
      - name: Verify release checks
        run: node tools/verify/cli.mjs release --stage pre --tag $env:DESKTOP_RELEASE_TAG
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets first.' }
          node .yarn/releases/yarn-3.4.1.cjs desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/scripts/generate-update-json.mjs $env:DESKTOP_RELEASE_TAG
      - name: Install test browser
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Verify built frontend
        run: node .yarn/releases/yarn-3.4.1.cjs verify release --stage post --tag $env:DESKTOP_RELEASE_TAG
      - name: Upload installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ github.ref_name }}
          path: desktop/release/
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-${{ github.ref_name }}
          path: .verify/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = @($releases | ConvertFrom-Json) | Where-Object tagName -eq $env:DESKTOP_RELEASE_TAG
          if ($existing) {
            if (-not $existing.isDraft) { throw 'This release is already published. Bump the desktop version for new binaries.' }
          } else {
            gh release create $env:DESKTOP_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Genshin Optimizer Local $env:DESKTOP_RELEASE_TAG" --notes-file desktop/release/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:DESKTOP_RELEASE_TAG desktop/release/Genshin-Optimizer-Local-Setup.exe desktop/release/Genshin-Optimizer-Local-Setup.exe.sig desktop/release/latest.json --repo $env:GITHUB_REPOSITORY --clobber
